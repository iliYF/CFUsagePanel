<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare 额度使用统计</title>
    <link rel="icon" href="https://cf-assets.www.cloudflare.com/dzlvafdwdttg/5uhbWfhjepEoUiM9phzhgJ/9658369030266cde9e35a3c5d4e4beb2/cloud-upload.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="main-page">
    <!-- 管理入口 -->
    <button class="admin-bubble" onclick="openLoginModal()" title="管理入口" style="border:none;cursor:pointer;">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </button>

    <div class="container">
        <div class="glass-card">
            <header>
                <h1>☁️ Cloudflare 额度使用统计</h1>
                <div class="status-row">
                    <span id="current-time" class="time-badge time-badge-left">--:--:--</span>
                    <div class="status-badge">
                        <span id="last-update-text">加载中...</span>
                        <span class="status-dot"></span>
                    </div>
                </div>
            </header>

            <div id="content">
                <div class="loading-wrap">
                    <div class="loading-spinner"></div>
                </div>
            </div>

            <div class="footer">
                由 <a href="https://github.com/cmliu/CF-Workers-UsagePanel" target="_blank" rel="noopener" class="footer">CF-Workers-UsagePanel</a> 强力驱动
            </div>
        </div>
    </div>

    <!-- 主题切换 -->
    <button class="theme-toggle" onclick="toggleTheme()" title="切换显示模式">
        <svg id="sun-icon" style="display:none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="18.36" x2="5.64" y2="19.78"></line><line x1="18.36" y1="4.22" x2="19.78" y2="5.64"></line></svg>
        <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- 登录模态框 -->
    <div id="loginModal" class="login-modal-overlay">
        <div class="login-modal-wrapper">
            <div class="login-modal">
                <button class="close-modal" onclick="closeLoginModal()" aria-label="关闭">&times;</button>
                <h2>🔐 管理员登录</h2>
                <div id="loginError" class="login-error"></div>
                <input type="text" class="login-input" id="adminUsername" placeholder="请输入管理员账号" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('adminPassword').focus()">
                <div class="password-wrap">
                    <input type="password" class="login-input" id="adminPassword" placeholder="请输入管理员密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()">
                    <button type="button" class="toggle-password" id="togglePwdBtn" onclick="togglePassword()" aria-label="显示密码">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div id="turnstile-widget" style="margin-bottom: 1rem; display: flex; justify-content: center;"></div>
                <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>
            </div>
        </div>
    </div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/js/app.js"></script>
    <script>
        // Turnstile 配置（由后端 /api/auth/token 下发）
        var TURNSTILE_SITEKEY = null;

        // 页面初始化
        initTheme();

        async function fetchUsage() {
            var content = document.getElementById('content');
            if (!usageToken) {
                content.innerHTML = '<div class="loading-wrap"><div class="loading-spinner"></div></div>';
                await initToken();
            }
            if (!usageToken) {
                content.innerHTML = '<div class="error-msg">无法获取访问 Token，请刷新页面</div>';
                return;
            }

            try {
                var token = getFullToken() || usageToken;
                var start = Date.now();
                var response = await fetch('/api/usage?token=' + token + '&t=' + start);
                var data = await response.json();
                var elapsed = Date.now() - start;
                if (elapsed < 600) await new Promise(function (r) { setTimeout(r, 600 - elapsed); });

                if (!data.success && typeof data.total === 'undefined') {
                    throw new Error('No Data Available');
                }

                var total = data.total || 0;
                var max = data.max || 100000;
                var percent = Math.min((total / max) * 100, 100).toFixed(1);
                var resources = getResources(data);

                content.innerHTML =
                    '<div class="usage-section">' +
                        '<div class="usage-header">' +
                            '<span class="label">总配额消耗</span>' +
                            '<span class="percentage">' + percent + '%</span>' +
                        '</div>' +
                        '<div class="progress-track">' +
                            '<div class="progress-bar" style="width: 0%"></div>' +
                        '</div>' +
                        '<div class="total-text">' +
                            total.toLocaleString() + ' / ' + max.toLocaleString() + ' 总计请求' +
                        '</div>' +
                    '</div>' +
                    '<div class="stats-grid">' +
                        '<div class="mini-card">' +
                            '<div class="mini-icon">🔶</div>' +
                            '<div class="mini-info">' +
                                '<div class="mini-label">Workers</div>' +
                                '<div class="mini-value">' + (data.workers || 0).toLocaleString() + '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="mini-card">' +
                            '<div class="mini-icon">⚡️</div>' +
                            '<div class="mini-info">' +
                                '<div class="mini-label">Pages</div>' +
                                '<div class="mini-value">' + (data.pages || 0).toLocaleString() + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    (hasDetailAccess() ? renderResourceQuotas(resources) :
                        '<div class="quota-summary quota-summary-locked">' +
                            '<span class="quota-summary-title">资源额度细节</span>' +
                            '<span class="quota-summary-meta quota-summary-meta-alert">登录后可查看</span>' +
                        '</div>');

                bindQuotaDetailsAnimations(content);

                requestAnimationFrame(function () {
                    var usageSection = content.querySelector('.usage-section');
                    var bar = content.querySelector('.progress-bar');
                    if (usageSection) applyGradientColor(usageSection, percent);
                    if (bar) bar.style.width = percent + '%';
                });

                // 更新状态
                var updateTime = data.UpdateTime ? new Date(data.UpdateTime).toLocaleString() : '';
                document.getElementById('last-update-text').textContent = updateTime || '实时';

                // 如果没有数据，显示登录入口
                if (total === 0 && !data.success) {
                    document.querySelector('.admin-bubble').style.display = 'none';
                }
            } catch (error) {
                console.error(error);
                content.innerHTML =
                    '<div class="error-msg">' +
                        '<div style="margin-bottom: 0.25rem; font-weight: 600;">数据获取失败</div>' +
                        '<div style="font-size: 0.8rem; opacity: 0.8;">' + (error.message || '未知错误') + '</div>' +
                    '</div>';
            }
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('adminUsername').focus();
            // 首次加载 Turnstile 配置
            loadTurnstileConfig().then(function () {
                var widget = document.getElementById('turnstile-widget');
                widget.innerHTML = '';
                if (TURNSTILE_SITEKEY && typeof turnstile !== 'undefined') {
                    turnstile.render('#turnstile-widget', {
                        sitekey: TURNSTILE_SITEKEY,
                        action: 'turnstile-spin-v2',
                        callback: function () {},
                    });
                }
            });
        }

        // 从后端获取 Turnstile 配置（仅首次请求）
        function loadTurnstileConfig() {
            if (TURNSTILE_SITEKEY !== null) return Promise.resolve();
            return fetch('/api/auth/token')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d.success && d.data.turnstileSiteKey) {
                        TURNSTILE_SITEKEY = d.data.turnstileSiteKey;
                    } else {
                        TURNSTILE_SITEKEY = ''; // 标记为已加载但未启用
                    }
                });
        }
        function togglePassword() {
            var input = document.getElementById('adminPassword');
            var btn = document.getElementById('togglePwdBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.classList.add('active');
            } else {
                input.type = 'password';
                btn.classList.remove('active');
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('adminUsername').value = '';
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminPassword').type = 'password';
            document.getElementById('togglePwdBtn').classList.remove('active');
            document.getElementById('loginError').classList.remove('show');
            // 重置 Turnstile
            if (typeof turnstile !== 'undefined') {
                turnstile.reset();
            }
            document.getElementById('turnstile-widget').innerHTML = '';
        }
        document.getElementById('loginModal').addEventListener('click', function (e) {
            if (e.target === this) closeLoginModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeLoginModal();
        });

        async function handleLogin() {
            var username = document.getElementById('adminUsername').value || 'admin';
            var password = document.getElementById('adminPassword').value;
            var loginBtn = document.getElementById('loginBtn');
            var errorDiv = document.getElementById('loginError');

            // 获取 Turnstile Token（仅在已渲染组件时）
            var turnstileToken = '';
            if (TURNSTILE_SITEKEY && typeof turnstile !== 'undefined') {
                try {
                    turnstileToken = turnstile.getResponse() || '';
                } catch (e) {
                    turnstileToken = '';
                }
            }

            if (!password) {
                errorDiv.textContent = '请输入密码';
                errorDiv.classList.add('show');
                document.getElementById('adminPassword').focus();
                return;
            }

            if (TURNSTILE_SITEKEY && !turnstileToken) {
                errorDiv.textContent = '请完成人机验证';
                errorDiv.classList.add('show');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            errorDiv.classList.remove('show');

            try {
                var response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        'cf-turnstile-response': turnstileToken,
                    })
                });
                var data = await response.json();
                if (data.success) {
                    if (data.data && data.data.fullToken) {
                        localStorage.setItem('cfuToken', data.data.fullToken);
                    }
                    window.location.href = '/admin.html';
                } else {
                    errorDiv.textContent = data.msg || '登录失败';
                    errorDiv.classList.add('show');
                    document.getElementById('adminUsername').select();
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请重试';
                errorDiv.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        }

        // 时钟
        function updateClock() {
            var el = document.getElementById('current-time');
            if (el) {
                var d = new Date();
                var y = d.getFullYear();
                var m = ('0' + (d.getMonth() + 1)).slice(-2);
                var day = ('0' + d.getDate()).slice(-2);
                var t = d.toLocaleTimeString();
                el.textContent = y + '-' + m + '-' + day + ' ' + t;
            }
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 启动
        fetchUsage();
        setInterval(fetchUsage, 600000);
    </script>
</body>
</html>
